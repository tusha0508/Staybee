# Keeps the Staybee site on Render's free plan awake.
# Render spins a free web service down after 15 minutes without traffic,
# so this pings it every 10 minutes. It also wakes the site up if it ever
# went to sleep (the in-app ping in server.js can't do that on its own).
#
# Setup (one time): GitHub repo -> Settings -> Secrets and variables ->
# Actions -> Variables tab -> New repository variable
#   Name:  SITE_URL
#   Value: your Render URL, e.g. https://staybee-website-xxxx.onrender.com
name: Keep Render awake

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes (UTC)
  workflow_dispatch:          # lets you run it manually from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping site
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "SITE_URL repository variable is not set. See the comment at the top of this file."
            exit 1
          fi
          URL="${SITE_URL%/}/healthz"
          # A sleeping free instance can take about a minute to wake, so allow
          # a generous timeout and a few retries.
          curl --silent --show-error --fail --max-time 120 \
               --retry 3 --retry-delay 20 --retry-all-errors \
               -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n" "$URL"
